name: susentorno

x-envoy: &envoy
  image: envoyproxy/envoy:v1.31-latest
  restart: unless-stopped
  # No volumes: run-hosting copies the proxy configuration into each container
  # with `docker cp` between create and start (ADR 0029).
  # Names the environment directory this container was brought up for;
  # run-hosting fills it in. verify-proxy.ps1 reads it to prove ownership.
  labels:
    susentorno.environment: '${SUSENTORNO_ENVIRONMENT_DIR:-}'
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  command: ['-c', '/etc/envoy/envoy.yaml', '--log-level', 'info']

services:
  envoy_blue:
    <<: *envoy
    container_name: susentorno-envoy-blue
    ports:
      - '127.0.0.1:${ENVOY_BLUE_HTTPS_PORT:-}:443'
      - '127.0.0.1:${ENVOY_BLUE_HTTP_PORT:-}:80'
      - '127.0.0.1:${ENVOY_BLUE_ADMIN_PORT:-}:9901'
  envoy_green:
    <<: *envoy
    container_name: susentorno-envoy-green
    ports:
      - '127.0.0.1:${ENVOY_GREEN_HTTPS_PORT:-}:443'
      - '127.0.0.1:${ENVOY_GREEN_HTTP_PORT:-}:80'
      - '127.0.0.1:${ENVOY_GREEN_ADMIN_PORT:-}:9901'
